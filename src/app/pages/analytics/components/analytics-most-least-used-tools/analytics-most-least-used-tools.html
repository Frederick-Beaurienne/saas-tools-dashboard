<section
  class="card
         p-5
         h-[360px]
         flex
         flex-col">

  <h2
    class="mb-6
           text-xl
           font-semibold
           text-primary">

    Most / Least Used Tools

  </h2>
  <div
    class="flex-1
         min-h-0">
    <div
      class="grid
           grid-cols-1
           md:grid-cols-2
           gap-6">

      <!-- MOST -->

      <div>

        <h3
          class="mb-4
               text-sm
               font-medium
               text-secondary">

          Most Used

        </h3>

        <div class="space-y-4">

          @for (item
            of mostUsed();
            track item.tool.id) {

            <div>

              <div
                class="mb-1
                     flex
                     items-center
                     justify-between
                     text-sm">

                <span>
                  {{ item.tool.name }}
                </span>

                <span
                  class="text-secondary">

                  {{ item.score }}

                </span>

              </div>

              <div
                class="h-2
                     rounded-full
                     bg-white/5">

                <div
                  class="h-full
                       rounded-full"
                  [style.width.%]="
                  barWidth(
                    item.score
                  )
                "
                  [ngStyle]="{
                  background:
                    'linear-gradient(90deg,#7c3aed 0%,#a855f7 100%)'
                }">
                </div>

              </div>

            </div>

          }

        </div>

      </div>

      <!-- LEAST -->

      <div>

        <h3
          class="mb-4
               text-sm
               font-medium
               text-secondary">

          Least Used

        </h3>

        <div class="space-y-4">

          @for (item
            of leastUsed();
            track item.tool.id) {

            <div>

              <div
                class="mb-1
                     flex
                     items-center
                     justify-between
                     text-sm">

                <span>
                  {{ item.tool.name }}
                </span>

                <span
                  class="text-secondary">

                  {{ item.score }}

                </span>

              </div>

              <div
                class="h-2
                     rounded-full
                     bg-white/5">

                <div
                  class="h-full
                       rounded-full"
                  [style.width.%]="
                  barWidth(
                    item.score
                  )
                "
                  [ngStyle]="{
                  background:
                    'linear-gradient(90deg,#ec4899 0%,#f43f5e 100%)'
                }">
                </div>

              </div>

            </div>

          }

        </div>

      </div>
    </div>
  </div>

</section>
