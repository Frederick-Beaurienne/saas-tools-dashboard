<header class="navbar px-10">

  <div class="flex h-14 items-center">

    <!-- Mobile menu button -->
    <button
      class="icon-btn mr-4 !hidden md:!hidden max-md:!flex"
      title="Navigation menu"
      (click)="toggleMobileMenu()">

      <lucide-icon
        [img]="Icons.Menu"
        size="20">
      </lucide-icon>

    </button>

    <!-- Left section -->
    <div class="navbar__left flex items-center gap-4 min-w-0">

      <div class="navbar__brand flex items-center gap-2 shrink-0">

        <div
          class="navbar__logo flex items-center justify-center">

          <lucide-icon
            [img]="Icons.Zap"
            size="18">
          </lucide-icon>

        </div>

        <div class="navbar__identity">

          <span class="navbar__title">
            TechCorp
          </span>

        </div>

      </div>

      <!-- Desktop navigation -->
      <nav
        class="navbar__nav hidden md:flex items-center">

        <a
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }">

          Dashboard

        </a>

        <a
          routerLink="/tools"
          routerLinkActive="active">

          Tools

        </a>

        <a
          routerLink="/analytics"
          routerLinkActive="active">

          Analytics

        </a>

        <a
          class="placeholder-link"
          title="Settings coming soon">

          Settings

        </a>

      </nav>

    </div>

    <!-- Desktop search -->
    <form
      class="navbar__search hidden
         lg:flex items-center
         gap-3 ml-auto
         w-[250px]
         rounded-xl px-3 py-3"
      (submit)="submitSearch(); $event.preventDefault()">

      <lucide-icon
        [img]="Icons.Search"
        size="16">
      </lucide-icon>

      <input
        type="search"
        class="bg-transparent
         outline-none
         w-full
         text-sm"
        placeholder="Search tools..."
        [value]="searchQuery()"
        (input)="searchQuery.set(
          $any($event.target).value
        )"
        (blur)="submitSearch()">

    </form>

    <!-- Actions -->
    <div
      class="navbar__actions flex items-center gap-2 shrink-0 ml-auto lg:ml-6">

      <button
        class="icon-btn"
        [class.icon-btn--sun]="isDarkTheme()"
        title="Theme switch"
        (click)="toggleTheme()">

        <lucide-icon
          [img]="CurrentThemeIcon()"
          size="18">
        </lucide-icon>

      </button>

      <button
        class="icon-btn placeholder"
        title="Notifications coming soon"
        disabled>

        <lucide-icon
          [img]="Icons.Bell"
          size="18">
        </lucide-icon>

      </button>

      <button
        class="icon-btn placeholder"
        title="Settings coming soon"
        disabled>

        <lucide-icon
          [img]="Icons.Settings"
          size="18">
        </lucide-icon>

      </button>

      <div
        class="navbar__profile placeholder flex items-center gap-2"
        title="Profile coming soon">

        <div class="navbar__avatar">
        </div>

        <lucide-icon
          [img]="Icons.ChevronDown"
          size="14">
        </lucide-icon>

      </div>

    </div>

  </div>

  <!-- Mobile search -->
  <div
    class="mt-4 lg:hidden pb-3">

    <form
      class="navbar__search flex
         items-center gap-3
         w-full rounded-xl
         px-4 py-3"
      (submit)="submitSearch(); $event.preventDefault()">

      <lucide-icon
        [img]="Icons.Search"
        size="16">
      </lucide-icon>

      <input
        type="search"
        class="bg-transparent
         outline-none
         w-full
         text-sm"
        placeholder="Search tools..."
        [value]="searchQuery()"
        (input)="searchQuery.set(
          $any($event.target).value
        )"
        (blur)="submitSearch()">

    </form>

  </div>

  <!-- Mobile navigation -->
  @if (isMobileMenuOpen()) {

    <div
      class="navbar__mobile-menu mt-4 flex flex-col gap-1 md:hidden">

      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMobileMenu()">

        Dashboard

      </a>

      <a
        routerLink="/tools"
        routerLinkActive="active"
        (click)="closeMobileMenu()">

        Tools

      </a>

      <a
        routerLink="/analytics"
        routerLinkActive="active"
        (click)="closeMobileMenu()">

        Analytics

      </a>

      <a
        class="placeholder-link"
        title="Settings coming soon">

        Settings

      </a>

    </div>

  }

</header>
