<section
  class="card
         p-5
         h-[360px]
         flex
         flex-col">
  <h2
    class="mb-5
           text-xl
           font-semibold
           text-primary">

    Top Expensive Tools

  </h2>

  @if (topTools().length > 0) {

    <div
      class="flex-1
         min-h-0">
      <canvas
        baseChart
        [data]="chartData()"
        [options]="chartOptions"
        [type]="'bar'">
      </canvas>

    </div>

  } @else {

    <div
      class="flex
             h-[320px]
             items-center
             justify-center
             text-secondary">

      Loading...

    </div>

  }

</section>
