<section
  class="card
         p-5
         h-[360px]
         flex
         flex-col">

  <h3
    class="text-lg
           font-semibold
           tracking-tight
           text-primary">

    Department Cost Breakdown

  </h3>

  <div
    class="flex-1
         min-h-0">

    @if (
      departmentData()
        .values
        .length
      ) {

      <canvas
        baseChart
        [data]="chartData()"
        [options]="chartOptions"
        [type]="'doughnut'">
      </canvas>

    } @else {

      <div
        class="h-full
               flex
               items-center
               justify-center
               text-secondary">

        Loading chart...

      </div>

    }

  </div>

</section>
